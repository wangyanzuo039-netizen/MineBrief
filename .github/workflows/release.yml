name: publish-demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen --python 3.11
      - run: uv run pytest -m "not live"
      - run: docker compose build agent
      - run: uv run python scripts/package_offline.py
      - name: Prepare isolated verification engine
        run: docker pull docker:29-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
      - name: Verify the actual release image with empty storage and no network
        shell: pwsh
        run: |
          ./scripts/verify_offline_cold.ps1 -PackagePath "$env:GITHUB_WORKSPACE/dist/mining-brief-offline.zip" -HelperImage 'docker:29-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskProof = Get-ChildItem outputs -Directory -Filter 'offline-cold-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $taskRecord = Get-Content -Raw -LiteralPath (Join-Path $taskProof.FullName 'cold-startup.json') | ConvertFrom-Json
          if ($taskRecord.exit_code -ne 0 -or -not $taskRecord.within_five_minutes) { throw 'Cold startup acceptance failed' }
          Copy-Item -LiteralPath (Join-Path $taskProof.FullName 'cold-startup.json') -Destination examples/release-startup-timing.json
          Copy-Item -LiteralPath (Join-Path (Join-Path $taskProof.FullName $taskRecord.run_id) 'brief.md') -Destination examples/release-template-brief.md
          Copy-Item -LiteralPath (Join-Path (Join-Path $taskProof.FullName $taskRecord.run_id) 'trace.jsonl') -Destination examples/release-template-trace.jsonl
      - name: Package the matching release evidence
        run: |
          uv run python scripts/package_offline.py
          uv run python scripts/package_delivery.py
          cd dist
          sha256sum --check mining-brief-offline.sha256 mining-brief-demo.sha256
      - name: Upload and publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view v0.1.0-demo --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          test "$draft" = true
          gh release upload v0.1.0-demo dist/mining-brief-offline.zip dist/mining-brief-offline.sha256 dist/mining-brief-demo.zip dist/mining-brief-demo.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.1.0-demo --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA" --notes-file .github/RELEASE_BODY.md
